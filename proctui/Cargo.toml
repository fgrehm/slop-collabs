[package]
name = "proctui"
version = "0.1.0"
edition = "2024"
description = "A small Linux TUI for measuring a command and its process group"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
