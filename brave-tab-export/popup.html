<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; }
    h1 { font-size: 13px; margin: 0 0 8px; }
    #groups { max-height: 260px; overflow-y: auto; border: 1px solid #8884; border-radius: 6px; }
    label { display: flex; gap: 8px; align-items: center; padding: 6px 8px; cursor: pointer; }
    label:hover { background: #8881; }
    label + label { border-top: 1px solid #8882; }
    .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; border: 1px solid #8886; }
    .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: #888; font-variant-numeric: tabular-nums; }
    .row { display: flex; gap: 6px; margin-top: 10px; }
    button { flex: 1; padding: 6px; font: inherit; cursor: pointer; }
    #status { margin-top: 10px; min-height: 1.2em; color: #888; }
  </style>
</head>
<body>
  <h1>Tab groups <span id="total"></span></h1>
  <div id="groups"></div>
  <div class="row">
    <button id="all">Select all</button>
    <button id="none">Select none</button>
  </div>
  <div class="row">
    <button id="export">Export to file</button>
    <button id="copy">Copy</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
